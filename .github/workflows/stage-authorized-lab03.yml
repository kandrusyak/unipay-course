name: Stage authorized Lab3 release
on:
  push:
    branches: [ops/lab03-public-release-20261008]
    paths: [.github/workflows/stage-authorized-lab03.yml]
permissions:
  contents: write
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install pytest==9.0.2
      - name: Import exactly the verified public-only artifact
        shell: python
        run: |
          import base64, contextlib, hashlib, io, json, subprocess, tempfile, urllib.request, zipfile
          from pathlib import Path
          import unipay as client
          base = 'b025116514180d26da54d7b07cd67e70ba54a449'
          source = 'dd84e4c1b25fb000b93255220e421d19fcce3e17'
          helper = '.github/workflows/stage-authorized-lab03.yml'
          assert subprocess.check_output(['git','rev-parse','origin/main'],text=True).strip() == base
          assert set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines()) == {helper}
          # This scoped temporary URL contains ONLY already validated student packets,
          # the public repository snapshot and delivery evidence. No private sources,
          # reference solutions, future lab packets or repository credentials.
          url = 'https://sdmntprukwest.oaiusercontent.com/files/00000000-bd44-8243-886a-f5eadc300542/raw?se=2026-10-08T11%3A27%3A56Z&sp=r&sv=2026-02-06&sr=b&scid=0cd5cd35-4c3d-54fd-bf6c-2273fd8987a2&skoid=40ce4b34-a373-4a62-b0bf-44befe221915&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-10-08T06%3A12%3A15Z&ske=2026-10-09T06%3A12%3A15Z&sks=b&skv=2026-02-06&sig=RkNCYqEo49UANdjCtUq1JtZOKa7z0paZcyGlxZpv8x4%3D'
          with urllib.request.urlopen(url,timeout=45) as response:
              raw = response.read(2000001)
          assert hashlib.sha256(raw).hexdigest() == '8b505bcbd0867d97ba3ade31ab514c3556470890997c8d7d456a6f16a2418ba9'
          old = json.loads(Path('catalog.json').read_bytes())
          old_files = {p.as_posix():p.read_bytes() for p in Path('bundles').glob('*.json')}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
              report = json.loads(archive.read('lab03-delivery-verification.json'))
              assert report['source']['source_commit'] == source
              assert report['public_base'] == base
              new = json.loads(archive.read('lab03-public/catalog.json'))
              assert set(new['labs']) == {'1','2','3'} and len(new['labs']['3']) == 14
              assert new['labs']['1'] == old['labs']['1'] and new['labs']['2'] == old['labs']['2']
              assert new['minimum_client'] == old['minimum_client']
              repaired = old['labs']['2']['merchant']['path']
              allowed = {'catalog.json',repaired,*(e['path'] for e in new['labs']['3'].values())}
              assert set(report['paths']) == allowed
              assert {p[len('lab03-public/'):] for p in archive.namelist() if p.startswith('lab03-public/')} == allowed
              for name in sorted(allowed):
                  data = archive.read('lab03-public/' + name)
                  assert hashlib.sha256(data).hexdigest() == report['hashes'][name]
                  assert name == 'catalog.json' or (name.startswith('bundles/') and name.endswith('.json') and '..' not in name)
                  target = Path(name)
                  if name not in ('catalog.json',repaired):
                      assert not target.exists()
                  target.parent.mkdir(parents=True,exist_ok=True)
                  target.write_bytes(data)
          assert all(Path(name).read_bytes() == data for name,data in old_files.items() if name != repaired)
          assert hashlib.sha256(Path(repaired).read_bytes()).hexdigest() == old['labs']['2']['merchant']['sha256']
          client.validate_catalog(new)
          for number, entries in new['labs'].items():
              for variant, entry in entries.items():
                  manifest, files = client.decode_public_bundle(Path(entry['path']).read_bytes(),entry,int(number),variant)
                  if number == '3':
                      assert manifest['source_commit'] == source
                      assert all(p.startswith('labs/lab03/') or p == '.github/workflows/lab03.yml' for p in files)
          with tempfile.TemporaryDirectory() as tmp:
              for variant in client.ORDER:
                  target = Path(tmp)/variant
                  target.mkdir()
                  (target/'unipay.py').write_bytes(Path('unipay.py').read_bytes())
                  fetch = lambda name,limit:Path(name).read_bytes()
                  with contextlib.redirect_stdout(io.StringIO()):
                      for number in (1,2):
                          assert client.install(number,variant,target,new,yes=True,fetch=fetch)['applied']
                          code = target/f'labs/lab{number:02d}/app/domain/{variant}.py'
                          code.write_bytes(code.read_bytes()+b'\n# retained student contribution\n')
                      before = {p.relative_to(target).as_posix():p.read_bytes() for p in target.rglob('*') if p.is_file()}
                      assert not client.install(3,variant,target,new,dry_run=True,fetch=fetch)['applied']
                      assert before == {p.relative_to(target).as_posix():p.read_bytes() for p in target.rglob('*') if p.is_file()}
                      assert client.install(3,variant,target,new,yes=True,fetch=fetch)['applied']
                      assert all((target/name).read_bytes()==data for name,data in before.items())
                      code = target/f'labs/lab03/app/domain/{variant}.py'
                      code.write_bytes(code.read_bytes()+b'\n# retained Lab3 solution\n')
                      solution = code.read_bytes()
                      assert client.install(3,variant,target,new,yes=True,fetch=fetch)['already_applied']
                      assert code.read_bytes()==solution
                      for number in (4,5,6):
                          try:
                              client.install(number,variant,target,new,yes=True,fetch=lambda *a:(_ for _ in ()).throw(AssertionError('future fetch')))
                          except client.DeliveryError:
                              pass
                          else:
                              raise AssertionError('future lab unexpectedly available')
          print('PASS: all 14 variants install 1/2/3; solutions preserved; 4/5/6 unavailable')
      - run: python check_public.py --run-lab1-tests
      - name: Stage only catalog and student packets
        run: |
          set -euo pipefail
          git rm .github/workflows/stage-authorized-lab03.yml
          git add catalog.json bundles
          test "$(git write-tree)" = f46f00b98b04d5fef2d69e434eaab827e2cf69cb
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Prepare verified Lab3 starters and restore original Merchant packet'
          git push origin HEAD:refs/heads/ops/lab03-public-release-20261008
          echo 'Validated candidate tree: f46f00b98b04d5fef2d69e434eaab827e2cf69cb'
