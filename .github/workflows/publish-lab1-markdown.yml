name: Publish revised Lab1 Markdown
on:
  push:
    branches: [publish/lab01-readable-markdown]
    paths: ['.github/workflows/publish-lab1-markdown.yml']
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: publish/lab01-readable-markdown
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Repack the fourteen Lab1 bundles
        shell: python
        run: |
          import base64, copy, hashlib, importlib.util, json, lzma
          from pathlib import Path

          ROOT = Path('.').resolve()
          spec = importlib.util.spec_from_file_location('unipay_public_client', ROOT/'unipay.py')
          unipay = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(unipay)

          SOURCE_COMMIT = 'e23cdef6077fcf7e62683a1976ecc69782840e1d'
          SOURCE_TREE = '5a0d8e99269de61e65260a8bb43ee056033b88ad'
          DOCS = ('TASK.md', 'REFERENCE.md', 'STARTER-STATE.md')
          DOC_PATHS = {f'labs/lab01/{name}' for name in DOCS}

          payload = json.loads(lzma.decompress(base64.b64decode(
              (ROOT/'checks/lab01-docs-update.txt').read_text(encoding='ascii').strip()
          )).decode('utf-8'))
          assert payload['source_commit'] == SOURCE_COMMIT
          assert payload['source_tree'] == SOURCE_TREE
          assert set(payload['docs']) == set(unipay.ORDER)

          catalog = unipay.validate_catalog(unipay.decode_json((ROOT/'catalog.json').read_bytes()))
          assert set(catalog['labs']) == {'1'}
          assert set(catalog['labs']['1']) == set(unipay.ORDER)
          old_paths = set()
          new_entries = {}

          for variant in unipay.ORDER:
              old_entry = catalog['labs']['1'][variant]
              old_path = ROOT / old_entry['path']
              old_paths.add(old_path)
              old_manifest, old_files = unipay.decode_public_bundle(old_path.read_bytes(), old_entry, 1, variant)
              before = {name: unipay.public_file_bytes(name, value) for name, value in old_files.items()}
              files = copy.deepcopy(old_files)
              manifest = copy.deepcopy(old_manifest)
              manifest['source_commit'] = SOURCE_COMMIT
              manifest['source_tree'] = SOURCE_TREE
              manifest.pop('guide_update', None)
              for short in DOCS:
                  name = f'labs/lab01/{short}'
                  assert name in files and isinstance(files[name], str)
                  text = payload['docs'][variant][short]
                  assert isinstance(text, str) and text.strip()
                  files[name] = text
                  manifest['files'][name] = hashlib.sha256(text.encode('utf-8')).hexdigest()
              for name, data in before.items():
                  if name not in DOC_PATHS:
                      assert unipay.public_file_bytes(name, files[name]) == data
              document = dict(format=1, course='unipay-oop', lab=1, variant=variant,
                              manifest=manifest, files=files)
              packed = lzma.compress(unipay.json_bytes(document), preset=6)
              wrapper = unipay.json_bytes(dict(encoding='xz+base64', data=base64.b64encode(packed).decode('ascii')))
              sha = hashlib.sha256(wrapper).hexdigest()
              entry = dict(path=f'bundles/{sha}.json', sha256=sha, size=len(wrapper), variant=variant,
                           source_commit=SOURCE_COMMIT, source_tree=SOURCE_TREE)
              checked_manifest, checked_files = unipay.decode_public_bundle(wrapper, entry, 1, variant)
              assert checked_manifest == manifest
              assert checked_files == files
              assert 'START_HERE.pdf' in files
              assert unipay.public_file_bytes('START_HERE.pdf', files['START_HERE.pdf']).startswith(b'%PDF-')
              path = ROOT / entry['path']
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_bytes(wrapper)
              new_entries[variant] = entry

          new_paths = {ROOT / entry['path'] for entry in new_entries.values()}
          for path in old_paths - new_paths:
              path.unlink()
          catalog['labs']['1'] = new_entries
          (ROOT/'catalog.json').write_text(json.dumps(catalog, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          unipay.validate_catalog(unipay.decode_json((ROOT/'catalog.json').read_bytes()))
          (ROOT/'checks/lab01-docs-update.txt').unlink()
          (ROOT/'.github/workflows/publish-lab1-markdown.yml').unlink()
      - name: Install public verification dependency
        run: python -m pip install pytest==9.0.2
      - name: Verify public packages before commit
        run: python check_public.py --run-lab1-tests
      - name: Commit generated package revision
        run: |
          git config user.name "UniPay course publisher"
          git config user.email "noreply@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Publish readable Markdown in all Lab1 packages"
          git push origin HEAD:publish/lab01-readable-markdown
