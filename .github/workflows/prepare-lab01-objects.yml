name: Stage verified public Lab1 objects
on:
  push:
    branches: ['publication/prepare-lab01-objects']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Verify all data before creating unreferenced public blobs; never update refs
        run: python prepare_blobs.py
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@v7
        with:
          name: verified-lab01-objects
          path: prepared/
          if-no-files-found: error
          retention-days: 7
