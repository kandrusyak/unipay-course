name: Prepare requested guide revision
on:
  push:
    branches: ['maintenance/repack-start-guide']
permissions:
  contents: write
concurrency:
  group: repack-start-guide
  cancel-in-progress: false
jobs:
  prepare:
    if: github.ref == 'refs/heads/maintenance/repack-start-guide'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - run: python -m pip install pytest==9.0.2
      - run: python _maintenance/run.py
      - run: python -m pytest -q checks/test_guide.py
      - run: python check_public.py --run-lab1-tests
      - name: Commit only prepared public files and retire this one-use workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm -r _maintenance .github/workflows/repack-guide-once.yml
          git add bundles catalog.json README.md unipay.py START_HERE.pdf .gitattributes check_public.py checks .github/workflows/public.yml
          git diff --cached --check
          git commit -m 'Repack Lab1 guide as Markdown and PDF; preserve student solutions'
          git push origin HEAD:refs/heads/maintenance/repack-start-guide
      - name: Archive the exact prepared source without credentials
        run: |
          mkdir -p /tmp/unipay-guide-artifact
          git archive --format=zip --output=/tmp/unipay-guide-artifact/source.zip HEAD
          git rev-parse HEAD > /tmp/unipay-guide-artifact/source-commit.txt
      - uses: actions/upload-artifact@v7
        with:
          name: prepared-guide-revision
          path: /tmp/unipay-guide-artifact/
          retention-days: 7
          if-no-files-found: error
